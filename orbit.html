<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Orbit</title>
<style>
  html,body{margin:0;height:100%;background:#05061a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Comic Sans MS',sans-serif;overflow:hidden}
  canvas{border-radius:16px;touch-action:none;max-width:100%;max-height:100%}
  #hint{color:#9aa;font-size:16px;margin-top:8px}
  #controls{position:fixed;top:14px;left:14px}
  button{padding:8px 16px;font-size:16px;border-radius:10px;border:none;cursor:pointer;background:#ffd93d;font-weight:bold;margin-right:6px}
  button.speed.active{background:#fff;box-shadow:0 0 0 3px #ffd93d inset}
  a#home{font-size:28px;text-decoration:none;background:#fff2;border-radius:12px;padding:6px 12px;margin-right:10px}
  #bubble{position:fixed;background:#fff;border-radius:16px;padding:14px 20px;font-size:20px;max-width:260px;box-shadow:0 4px 20px rgba(0,0,0,0.4);display:none;text-align:center}
  #bubble .name{font-size:24px;font-weight:bold;margin-bottom:6px}
</style>
</head>
<body>
<div id="controls">
  <a id="home" href="index.html">🏠</a>
  <button id="playBtn">⏸ Pause</button>
  <button class="speed active" data-speed="1">1x</button>
  <button class="speed" data-speed="2">2x</button>
  <button class="speed" data-speed="4">4x</button>
  <button class="speed" data-speed="10">10x</button>
  <button class="speed" data-speed="20">20x</button>
  <button id="zoomBtn">🔍 Zoom: Inner</button>
</div>
<canvas id="c"></canvas>
<div id="hint">Drag any planet to move it — watch what happens to the others! Tap a planet for a fact.</div>
<div id="bubble"><div class="name"></div><div class="text"></div></div>
<script src="assets.js"></script>
<script src="data.js"></script>
<script src="ui.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const bubble = document.getElementById('bubble');
const playBtn = document.getElementById('playBtn');

const BASE = 720; // design size everything below is tuned for; scaled by k on resize
const ORBIT_SIZES = { Mercury: 6, Venus: 10, Earth: 11, Mars: 8, Jupiter: 24, Saturn: 21, Uranus: 15, Neptune: 15 };

const EARTH_ORBIT_FRAMES = 480; // frames for one Earth orbit at normal speed
const baseSpeed = (2 * Math.PI) / EARTH_ORBIT_FRAMES; // rad/frame for Earth

const planets = SolarData.PLANETS.map(p => ({ ...p, baseSize: ORBIT_SIZES[p.name], speed: baseSpeed / p.period }));
const auMin = Math.sqrt(planets[0].au), auMax = Math.sqrt(planets[planets.length - 1].au);

let W, H, cx, cy, sunR, minOrbit, maxOrbit, innerZoom;

function layout(k) {
  sunR = 30 * k;
  minOrbit = 55 * k;
  maxOrbit = 330 * k;
  planets.forEach(p => {
    p.size = p.baseSize * k;
    p.orbitR = minOrbit + (maxOrbit - minOrbit) * (Math.sqrt(p.au) - auMin) / (auMax - auMin);
  });
  const marsOrbitR = planets.find(p => p.name === 'Mars').orbitR;
  innerZoom = (cx - 90 * k) / marsOrbitR;
}

SolarUI.setupResponsiveCanvas(canvas,
  (iw, ih) => {
    const size = Math.floor(Math.min(iw * 0.94, ih * 0.85, 900));
    return { width: size, height: size };
  },
  (w, h) => {
    W = w; H = h;
    cx = W / 2; cy = H / 2;
    layout(W / BASE);
  });

let clock = 0;
let playing = true;
let dragTarget = null;
let lastMouseAngle = 0;
let downPos = null;
let focused = null;
let zoom = 1;

function screenToModel(sx, sy) {
  return { x: cx + (sx - cx) / zoom, y: cy + (sy - cy) / zoom };
}

function modelToScreen(mx, my) {
  return { x: cx + (mx - cx) * zoom, y: cy + (my - cy) * zoom };
}

function planetPos(p) {
  const a = clock * p.speed;
  return { x: cx + Math.cos(a) * p.orbitR, y: cy + Math.sin(a) * p.orbitR, angle: a };
}

function drawOrbitRing(p) {
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(cx, cy, p.orbitR, 0, Math.PI*2);
  ctx.stroke();
}

function drawPlanet(p) {
  const pos = planetPos(p);
  p._pos = pos;
  drawOrbitRing(p);

  if (p.hasRings) {
    ctx.strokeStyle = '#c9b48a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(pos.x, pos.y, p.size*1.7, p.size*0.6, 0.4, 0, Math.PI*2);
    ctx.stroke();
  }

  PlanetArt.drawSphere(ctx, pos.x, pos.y, p.size, p.color);

  if (focused === p) {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, p.size + 6, 0, Math.PI*2);
    ctx.stroke();
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#05061a';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(zoom, zoom);
  ctx.translate(-cx, -cy);

  PlanetArt.drawSun(ctx, cx, cy, sunR);

  planets.forEach(drawPlanet);
  ctx.restore();
}

function angleAt(x, y) {
  return Math.atan2(y - cy, x - cx);
}

function planetUnderMouse(mx, my) {
  for (const p of planets) {
    const pos = p._pos;
    if (!pos) continue;
    const d = Math.hypot(mx - pos.x, my - pos.y);
    if (d <= Math.max(p.size + 8, 22)) return p;
  }
  return null;
}

function showBubble(p) {
  focused = p;
  const fact = p.facts[Math.floor(Math.random() * p.facts.length)];
  bubble.querySelector('.name').textContent = p.name;
  bubble.querySelector('.text').textContent = fact;
  SolarUI.speak(`${p.name}. ${fact}`);
  const screenPos = modelToScreen(p._pos.x, p._pos.y);
  const pos = SolarUI.canvasToClient(canvas, W, screenPos.x, screenPos.y);
  bubble.style.left = Math.min(pos.x + 20, window.innerWidth - 280) + 'px';
  bubble.style.top = Math.max(pos.y - 60, 10) + 'px';
  bubble.style.display = 'block';
  playing = false;
  playBtn.textContent = '▶ Play';
}

function hideBubble() {
  focused = null;
  bubble.style.display = 'none';
}

canvas.addEventListener('pointerdown', (e) => {
  const c = SolarUI.clientToCanvas(canvas, W, e.clientX, e.clientY);
  const { x: mx, y: my } = screenToModel(c.x, c.y);
  downPos = { x: mx, y: my };
  const p = planetUnderMouse(mx, my);
  if (p) {
    dragTarget = p;
    canvas.setPointerCapture(e.pointerId);
    lastMouseAngle = angleAt(mx, my);
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (!dragTarget) return;
  const c = SolarUI.clientToCanvas(canvas, W, e.clientX, e.clientY);
  const { x: mx, y: my } = screenToModel(c.x, c.y);
  const a = angleAt(mx, my);
  let delta = a - lastMouseAngle;
  if (delta > Math.PI) delta -= Math.PI*2;
  if (delta < -Math.PI) delta += Math.PI*2;
  clock += delta / dragTarget.speed;
  lastMouseAngle = a;
  hideBubble();
});

canvas.addEventListener('pointerup', (e) => {
  if (dragTarget && downPos) {
    const c = SolarUI.clientToCanvas(canvas, W, e.clientX, e.clientY);
    const { x: mx, y: my } = screenToModel(c.x, c.y);
    const moved = Math.hypot(mx - downPos.x, my - downPos.y);
    if (moved < 4) {
      showBubble(dragTarget);
    }
  }
  dragTarget = null;
  downPos = null;
});
canvas.addEventListener('pointercancel', () => { dragTarget = null; downPos = null; });

canvas.addEventListener('click', (e) => {
  if (dragTarget) return;
  const c = SolarUI.clientToCanvas(canvas, W, e.clientX, e.clientY);
  const { x: mx, y: my } = screenToModel(c.x, c.y);
  if (!planetUnderMouse(mx, my)) hideBubble();
});

playBtn.addEventListener('click', () => {
  playing = !playing;
  playBtn.textContent = playing ? '⏸ Pause' : '▶ Play';
  if (playing) hideBubble();
});

let speedMultiplier = 1;
document.querySelectorAll('button.speed').forEach(btn => {
  btn.addEventListener('click', () => {
    speedMultiplier = Number(btn.dataset.speed);
    document.querySelectorAll('button.speed').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

const zoomBtn = document.getElementById('zoomBtn');
zoomBtn.addEventListener('click', () => {
  zoom = zoom === 1 ? innerZoom : 1;
  zoomBtn.textContent = zoom === 1 ? '🔍 Zoom: Inner' : '🔭 Zoom: Full';
});

function loop() {
  if (playing) clock += baseSpeed * speedMultiplier;
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
