<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Meet the Planets</title>
<style>
  html,body{margin:0;height:100%;background:#05061a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Comic Sans MS',sans-serif;overflow:hidden}
  #label{font-size:44px;color:#fff;margin-bottom:6px;text-shadow:0 0 10px rgba(255,255,255,0.3);min-height:56px}
  canvas{border-radius:16px;max-width:100%;max-height:100%;touch-action:none}
  #hint{color:#9aa;font-size:16px;margin-top:10px;text-align:center;max-width:600px}
  a#home{position:fixed;top:16px;left:16px;font-size:28px;text-decoration:none;background:#fff2;border-radius:12px;padding:6px 12px}
</style>
</head>
<body>
<a id="home" href="index.html">🏠</a>
<div id="label">Tap a planet!</div>
<canvas id="c"></canvas>
<div id="hint">The planets always line up in the same order, going out from the sun. Tap one to hear its name!</div>
<script src="assets.js"></script>
<script src="data.js"></script>
<script src="ui.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const label = document.getElementById('label');

const bodies = SolarData.ALL;

const minR = 16, maxR = 78, sunR = 95;
const diamMin = Math.sqrt(Math.min(...SolarData.PLANETS.map(b => b.diam)));
const diamMax = Math.sqrt(Math.max(...SolarData.PLANETS.map(b => b.diam)));
bodies.forEach(b => {
  b.r = b.isSun ? sunR : minR + (maxR - minR) * (Math.sqrt(b.diam) - diamMin) / (diamMax - diamMin);
});

let W, H, baseline;
let highlighted = null;
let highlightUntil = 0;

SolarUI.setupResponsiveCanvas(canvas,
  (iw, ih) => ({
    width: Math.floor(Math.min(iw * 0.96, 1100)),
    height: Math.floor(Math.min(ih * 0.62, 420)),
  }),
  (w, h) => {
    W = w; H = h;
    baseline = H * 0.72;
    const margin = W * 0.06;
    const slot = (W - margin * 2) / bodies.length;
    bodies.forEach((b, i) => {
      b.x = margin + slot * (i + 0.5);
      b.y = baseline - b.r;
    });
  });

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#05061a';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, baseline);
  ctx.lineTo(W, baseline);
  ctx.stroke();

  const now = performance.now();
  bodies.forEach(b => {
    const isHi = highlighted === b && now < highlightUntil;
    const r = isHi ? b.r * 1.12 : b.r;
    const y = baseline - r;

    if (b.hasRings) {
      ctx.strokeStyle = '#c9b48a';
      ctx.lineWidth = Math.max(2, r * 0.12);
      ctx.beginPath();
      ctx.ellipse(b.x, y, r * 1.7, r * 0.55, 0.4, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (b.isSun) {
      PlanetArt.drawSun(ctx, b.x, y, r);
    } else {
      PlanetArt.drawSphere(ctx, b.x, y, r, b.color);
    }

    if (isHi) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(b.x, y, r + 8, 0, Math.PI * 2);
      ctx.stroke();
    }
  });

  requestAnimationFrame(draw);
}

function bodyAt(x, y) {
  for (const b of bodies) {
    const by = baseline - b.r;
    const hitR = Math.max(b.r + 10, 26);
    if (Math.hypot(x - b.x, y - by) <= hitR) return b;
  }
  return null;
}

canvas.addEventListener('click', (e) => {
  const { x, y } = SolarUI.clientToCanvas(canvas, W, e.clientX, e.clientY);
  const b = bodyAt(x, y);
  if (!b) return;
  highlighted = b;
  highlightUntil = performance.now() + 700;
  SolarUI.speak(b.name);
  label.textContent = b.name + '!';
  const fact = b.facts[Math.floor(Math.random() * b.facts.length)];
  setTimeout(() => { label.textContent = fact; }, 900);
});

draw();
</script>
</body>
</html>
