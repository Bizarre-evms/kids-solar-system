<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Meet the Planets</title>
<style>
  html,body{margin:0;height:100%;background:#05061a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Comic Sans MS',sans-serif;overflow:hidden}
  #label{font-size:44px;color:#fff;margin-bottom:6px;text-shadow:0 0 10px rgba(255,255,255,0.3);min-height:56px}
  canvas{border-radius:16px;max-width:100%;max-height:100%}
  #hint{color:#9aa;font-size:16px;margin-top:10px;text-align:center;max-width:600px}
  a#home{position:fixed;top:16px;left:16px;font-size:28px;text-decoration:none;background:#fff2;border-radius:12px;padding:6px 12px}
</style>
</head>
<body>
<a id="home" href="index.html">🏠</a>
<div id="label">Tap a planet!</div>
<canvas id="c"></canvas>
<div id="hint">The planets always line up in the same order, going out from the sun. Tap one to hear its name!</div>
<script src="assets.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const label = document.getElementById('label');

const bodies = [
  { name: 'Sun',     diam: 1391000, isSun: true, color: '#ffd93d', fact: "I'm a star, not a planet — but everyone circles around me!" },
  { name: 'Mercury', diam: 4879,   color: '#b5a49a', fact: "I'm 1st from the sun, and the smallest planet!" },
  { name: 'Venus',   diam: 12104,  color: '#e8c27a', fact: "I'm 2nd from the sun." },
  { name: 'Earth',   diam: 12742,  color: '#4a90d9', fact: "I'm 3rd from the sun — this is home!" },
  { name: 'Mars',    diam: 6779,   color: '#c1440e', fact: "I'm 4th from the sun, the red one!" },
  { name: 'Jupiter', diam: 139820, color: '#d9a066', fact: "I'm 5th from the sun, and the BIGGEST planet of all!" },
  { name: 'Saturn',  diam: 116460, color: '#e8d5a0', fact: "I'm 6th from the sun, with beautiful rings!", hasRings: true },
  { name: 'Uranus',  diam: 50724,  color: '#9fd9d9', fact: "I'm 7th from the sun." },
  { name: 'Neptune', diam: 49244,  color: '#4166f5', fact: "I'm 8th and last from the sun!" },
];

const minR = 16, maxR = 78, sunR = 60;
const diamMin = Math.sqrt(Math.min(...bodies.filter(b => !b.isSun).map(b => b.diam)));
const diamMax = Math.sqrt(Math.max(...bodies.filter(b => !b.isSun).map(b => b.diam)));
bodies.forEach(b => {
  if (b.isSun) { b.r = sunR; return; }
  b.r = minR + (maxR - minR) * (Math.sqrt(b.diam) - diamMin) / (diamMax - diamMin);
});

let W, H, baseline;
let highlighted = null;
let highlightUntil = 0;

function resize() {
  W = Math.floor(Math.min(window.innerWidth * 0.96, 1100));
  H = Math.floor(Math.min(window.innerHeight * 0.62, 420));
  canvas.width = W;
  canvas.height = H;
  baseline = H * 0.72;
  const margin = W * 0.06;
  const slot = (W - margin * 2) / bodies.length;
  bodies.forEach((b, i) => {
    b.x = margin + slot * (i + 0.5);
    b.y = baseline - b.r;
  });
}
window.addEventListener('resize', resize);

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.85;
  u.pitch = 1.15;
  window.speechSynthesis.speak(u);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#05061a';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, baseline);
  ctx.lineTo(W, baseline);
  ctx.stroke();

  const now = performance.now();
  bodies.forEach(b => {
    const isHi = highlighted === b && now < highlightUntil;
    const r = isHi ? b.r * 1.12 : b.r;
    const y = baseline - r;

    if (b.hasRings) {
      ctx.strokeStyle = '#c9b48a';
      ctx.lineWidth = Math.max(2, r * 0.12);
      ctx.beginPath();
      ctx.ellipse(b.x, y, r * 1.7, r * 0.55, 0.4, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (b.isSun) {
      PlanetArt.drawSun(ctx, b.x, y, r);
    } else {
      PlanetArt.drawSphere(ctx, b.x, y, r, b.color);
    }

    if (isHi) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(b.x, y, r + 8, 0, Math.PI * 2);
      ctx.stroke();
    }
  });

  requestAnimationFrame(draw);
}

function bodyAt(x, y) {
  for (const b of bodies) {
    const by = baseline - b.r;
    if (Math.hypot(x - b.x, y - by) <= b.r + 10) return b;
  }
  return null;
}

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scale = W / rect.width;
  const x = (e.clientX - rect.left) * scale;
  const y = (e.clientY - rect.top) * scale;
  const b = bodyAt(x, y);
  if (!b) return;
  highlighted = b;
  highlightUntil = performance.now() + 700;
  speak(b.name);
  label.textContent = b.name + '!';
  setTimeout(() => { label.textContent = b.fact; }, 900);
});

resize();
draw();
</script>
</body>
</html>
